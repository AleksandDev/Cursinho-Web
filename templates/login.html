<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/styles/login.css">
    <link rel="shortcut icon" href="/static/src/images/LogoCursinhoWeb.png" type="image/x-icon">
</head>
<body>
    <main>
        <section class="login-section">
            <h1>Login</h1>
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <button type="submit">Login</button>
                </div>
                <span><a href="/cadastro">Não tem conta? Cadastre-se</a> / <a href="/recuperar-senha">Recuperar Senha</a></span>
                <p>{% if message %}{{ message }}{% endif %}</p>
            </form>
        </section>
    </main>
</body>
</html>
